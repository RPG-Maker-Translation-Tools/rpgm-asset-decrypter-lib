[package]
name = "rpgmasd-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version = "1.81.0"
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/RPG-Maker-Translation-Tools/rpgm-asset-decrypter-lib/tree/main/wasm"
keywords = ["rpgmaker", "wasm", "decrypt", "encrypt", "assets"]
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--converge",
    "--low-memory-unused",
    "--strip-producers",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-multivalue",
    "--enable-reference-types",
]

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
rpgm-asset-decrypter-lib = { path = ".." }
wasm-bindgen = "0.2.129"

[dev-dependencies]
js-sys = "0.3.106"
wasm-bindgen-test = "0.3.79"
