[package]
name = "rpgmasd-wasm"
version = "0.1.0"
authors = ["savannstm <savannstm@gmail.com>"]
edition = "2021"
rust-version = "1.71.0"
description = "WASM bindings for rpgm-asset-decrypter-lib."
license-file = "../LICENSE.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpgm-asset-decrypter-lib = { path = ".." }
wasm-bindgen = "=0.2.127"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]
