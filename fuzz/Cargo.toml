[package]
name = "rpgm-asset-decrypter-lib-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[[bin]]
name = "decrypt"
path = "fuzz_targets/decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key"
path = "fuzz_targets/key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capi"
path = "fuzz_targets/capi.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4.13"
rpgm-asset-decrypter-lib = { path = "..", features = ["alloc", "std", "serde"] }
rpgmasd-capi = { path = "../capi", features = ["std", "capi"] }
