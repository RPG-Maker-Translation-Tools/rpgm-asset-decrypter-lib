[package]
name = "rpgm-asset-decrypter-lib"
version = "3.2.3"
authors = ["savannstm <savannstm@gmail.com>"]
edition = "2018"
rust-version = "1.71.0"
description = "A library for decrypting/encrypting RPG Maker MV/MZ audio and image assets."
documentation = "https://docs.rs/rpgm-asset-decrypter-lib"
readme = "README.md"
repository = "https://github.com/savannstm/rpgm-asset-decrypter-lib"
license-file = "LICENSE.md"

[workspace]
members = ["crates/rpgmasd-wasm", "crates/rpgmasd-capi"]

[workspace.package]
version = "3.2.3"
edition = "2021"
rust-version = "1.71.0"
authors = ["savannstm <savannstm@gmail.com>"]

[features]
default = ["std"]
# The Vec-returning `encrypt`/`decrypt` API. Pulls in `alloc`.
alloc = []
std = ["alloc", "thiserror/std"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = { version = "2.0.20", default-features = false, features = [] }
