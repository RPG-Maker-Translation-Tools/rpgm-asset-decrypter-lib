[package]
name = "rpgm-asset-decrypter-lib"
version = "3.2.4"
authors = ["savannstm <savannstm@gmail.com>"]
edition = "2021"
rust-version = "1.77.0"
description = "A library for decrypting/encrypting RPG Maker MV/MZ audio and image assets."
documentation = "https://docs.rs/rpgm-asset-decrypter-lib"
readme = "README.md"
repository = "https://github.com/RPG-Maker-Translation-Tools/rpgm-asset-decrypter-lib"
homepage = "https://crates.io/crates/rpgm-asset-decrypter-lib"
license = "WTFPL"
keywords = ["rpgmaker", "assets", "decrypt", "encrypt", "mv"]
categories = ["encoding", "game-development"]
exclude = ["/.gitignore", "/.gitattributes", "/rustfmt.toml", "/ts", "/tests"]

[workspace]
members = ["crates/rpgmasd-capi", "crates/rpgmasd-wasm"]

[workspace.package]
version = "3.2.4"
edition = "2021"
rust-version = "1.77.0"
authors = ["savannstm <savannstm@gmail.com>"]
description = "A library for decrypting/encrypting RPG Maker MV/MZ audio and image assets."
license = "WTFPL"
repository = "https://github.com/RPG-Maker-Translation-Tools/rpgm-asset-decrypter-lib"
homepage = "https://crates.io/crates/rpgm-asset-decrypter-lib"

[features]
default = ["std"]
# The Vec-returning `encrypt`/`decrypt` API. Pulls in `alloc`.
alloc = []
std = ["alloc", "thiserror/std"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = { version = "2.0.21", default-features = false, features = [] }
