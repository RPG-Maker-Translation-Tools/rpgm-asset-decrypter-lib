[package]
name = "rpgmasd-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
publish = false

[package.metadata.capi.header]
name = "rpgmasd"
subdirectory = "rpgmasd"

[package.metadata.capi.pkg_config]
name = "rpgmasd"
filename = "rpgmasd"

[package.metadata.capi.library]
name = "rpgmasd"

[lib]
name = "rpgmasd"
crate-type = ["cdylib", "staticlib"]
doctest = false

[features]
default = ["std"]
std = ["rpgm-asset-decrypter-lib/std"]
capi = []

[dependencies]
rpgm-asset-decrypter-lib = { path = "..", default-features = false }
