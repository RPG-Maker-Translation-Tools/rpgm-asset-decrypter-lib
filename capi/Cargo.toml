[package]
name = "rpgmasd-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
publish = false

[package.metadata.capi.header]
name = "rpgmasd"
subdirectory = "rpgmasd"

[package.metadata.capi.pkg_config]
name = "rpgmasd"
filename = "rpgmasd"

[package.metadata.capi.library]
name = "rpgmasd"

[lib]
name = "rpgmasd"
# `rlib` is only for the Rust fuzz targets, which depend on this crate; the C artifacts are unchanged.
crate-type = ["cdylib", "staticlib", "rlib"]
doctest = false

[features]
default = ["std"]
std = ["rpgm-asset-decrypter-lib/std"]
capi = []

[dependencies]
rpgm-asset-decrypter-lib = { path = "..", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
